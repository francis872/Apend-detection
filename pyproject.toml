[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-outliers"
version = "0.1.0"
description = "Geospatial outlier detection with probability fitting, Fisher-Rao, Bhattacharyya, SPD geometry and Procrustes"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "geopandas>=1.0", "scipy>=1.12",
  "scikit-learn>=1.4", "shapely>=2.0", "pyproj>=3.6", "pyogrio>=0.9"
]

[project.scripts]
geo-outliers = "geo_outliers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
