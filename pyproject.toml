[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-outliers"
version = "1.9.0"
description = "Meridian multi-industry Geospatial Intelligence Engine for detecting where, when and why territories behave differently"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "geopandas>=1.0", "scipy>=1.12",
  "scikit-learn>=1.4", "shapely>=2.0", "pyproj>=3.6", "pyogrio>=0.9",
  "openpyxl>=3.1", "pyarrow>=16.0",
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "httpx>=0.27"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
geo-outliers = "geo_outliers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
